[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servo-counter"
version = "0.1.0"
description = "A Raspberry Pi controller for up to sixteen mechanical decimal displays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "waitress>=3,<4"]

[project.optional-dependencies]
pi = ["smbus2>=0.5,<1", "gpiozero>=2,<3", "lgpio>=0.2,<1"]

[project.scripts]
counter = "counter.__main__:main"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
counter = ["templates/*.html", "static/*.css", "static/*.js", "static/fonts/*"]
