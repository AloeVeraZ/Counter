<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
  <title id="title">Counter: every Pi, PCA9685 and servo wire</title>
  <desc id="desc">Physical Pi pin 1 supplies 3.3 volts to VCC; pin 3 GPIO2 to SDA; pin 5 GPIO3 to SCL; pin 7 GPIO4 to OE; pin 9 ground to GND; pin 2 supplies 5 volts to V+ in the user's unvalidated prototype. A 1 kilohm resistor connects OE to VCC. Every servo connects its signal to its channel's PWM pin, red power to V+, and brown or black ground to GND.</desc>
  <rect width="1000" height="930" rx="20" fill="#111214"/>
  <g font-family="Arial, sans-serif" fill="#f7f4ed">
    <text x="40" y="44" font-size="25" font-weight="bold">COUNTER / COMPLETE WIRING</text>
    <text x="40" y="73" font-size="16" fill="#b4b1a9">Connection map — use pin numbers and board labels, not drawing positions.</text>
    <rect x="30" y="100" width="295" height="410" rx="12" fill="#17181b" stroke="#49515c"/>
    <rect x="650" y="100" width="320" height="410" rx="12" fill="#17181b" stroke="#49515c"/>
    <text x="50" y="133" font-size="23" font-weight="bold">RASPBERRY PI</text>
    <text x="675" y="133" font-size="23" font-weight="bold">PCA9685</text>
    <text x="50" y="156" font-size="15" fill="#b4b1a9">40-pin header · physical pin numbers</text>
    <text x="675" y="156" font-size="15" fill="#b4b1a9">I²C1 · address 0x40 · 50 Hz</text>

    <g font-size="19">
      <text x="50" y="195">1 · 3.3 V</text><text x="675" y="195">VCC · 3.3 V logic</text>
      <text x="50" y="245">3 · GPIO2 / SDA</text><text x="675" y="245">SDA · data</text>
      <text x="50" y="295">5 · GPIO3 / SCL</text><text x="675" y="295">SCL · clock</text>
      <text x="50" y="345">7 · GPIO4 / BCM4</text><text x="675" y="345">OE · output enable</text>
      <text x="50" y="395">9 · GND</text><text x="675" y="395">GND · common ground</text>
      <text x="50" y="445">2 · 5 V</text><text x="675" y="445">V+ · 5 V servo power</text>
    </g>
    <g fill="none" stroke-width="4">
      <path d="M305 190H660" stroke="#f0c063"/>
      <path d="M305 240H660" stroke="#45cf9a"/>
      <path d="M305 290H660" stroke="#9dccff"/>
      <path d="M305 340H660" stroke="#c3a5ed"/>
      <path d="M305 390H660" stroke="#a8adb4"/>
      <path d="M305 440H660" stroke="#ff8189"/>
    </g>
    <text x="374" y="183" font-size="15" fill="#f0c063">3.3 V / LOGIC</text>
    <text x="374" y="433" font-size="15" fill="#ff8189">5 V / MOTORS</text>

    <path d="M660 190V170H942V208M942 278V357H660V340" fill="none" stroke="#c3a5ed" stroke-width="3"/>
    <rect x="933" y="208" width="18" height="70" fill="#111214" stroke="#c3a5ed" stroke-width="3"/>
    <circle cx="660" cy="190" r="5" fill="#f0c063"/>
    <circle cx="660" cy="340" r="5" fill="#c3a5ed"/>
    <text x="875" y="237" text-anchor="middle" font-size="14" fill="#c3a5ed">1 kΩ</text>
    <text x="875" y="258" text-anchor="middle" font-size="14" fill="#c3a5ed">pull-up</text>
    <text x="50" y="482" font-size="16" fill="#b4b1a9">USB-C → Pi power input</text>
    <text x="675" y="482" font-size="15" fill="#b4b1a9">OE high = stopped · OE low = enabled</text>

    <rect x="30" y="530" width="940" height="102" rx="12" fill="#282116" stroke="#f0c063"/>
    <text x="50" y="560" font-size="19" font-weight="bold" fill="#f0c063">PI 5 V → V+ IS THE REQUESTED PROTOTYPE CONNECTION</text>
    <text x="50" y="587" font-size="16">Its power budget is unverified. One moving servo can still stall or brown out the Pi.</text>
    <text x="50" y="612" font-size="16">Use a suitably rated external servo supply for a validated setup. Keep VCC at 3.3 V.</text>

    <rect x="30" y="650" width="295" height="182" rx="12" fill="#17181b" stroke="#49515c"/>
    <rect x="650" y="650" width="320" height="182" rx="12" fill="#17181b" stroke="#49515c"/>
    <text x="50" y="681" font-size="22" font-weight="bold">CHANNEL n / 0–15</text>
    <text x="675" y="681" font-size="22" font-weight="bold">SERVO n / DISPLAY n+1</text>
    <g font-size="18">
      <text x="50" y="723">PWM / signal</text><text x="675" y="723">Signal · yellow / orange / white</text>
      <text x="50" y="765">V+ / positive</text><text x="675" y="765">Power · red · +5 V</text>
      <text x="50" y="807">GND / negative</text><text x="675" y="807">Ground · brown / black</text>
    </g>
    <g fill="none" stroke-width="4">
      <path d="M305 718H660" stroke="#f0c063"/>
      <path d="M305 760H660" stroke="#ff8189"/>
      <path d="M305 802H660" stroke="#a8adb4"/>
    </g>
    <text x="40" y="864" font-size="17">Repeat all three servo wires for each display: leftmost → CH 0, next → CH 1, … CH 15.</text>
    <text x="40" y="891" font-size="16" fill="#b4b1a9">Follow your servo's connector labels; colours can vary. Stop outputs does not disconnect V+.</text>
    <text x="40" y="916" font-size="16" fill="#b4b1a9">External supply alternative: disconnect Pi pin 2 → V+; supply + → V+, supply − → shared GND.</text>
  </g>
</svg>
